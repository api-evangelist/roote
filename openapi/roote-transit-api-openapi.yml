  /v1/transit/stations/{id}/departures:
    get:
      operationId: getTransportDepartures
      security:
      - {}
      - bearerAuth: []
      x-roote-required-scope: data:read
      summary: Get upcoming departures for a transport station
      description: Requires data:read. Resolves the canonical ROOTE station ID to active provider references server-side, executes a bounded plan over established boarding relations and reconciles only proven passage occurrences. expected_at is the selected display time; coherence.timing separates nullable scheduled and predicted times and identifies stale or unknown freshness fallbacks. An all-provider failure has status error, not empty. Departure IDs no longer use display labels; consumers must treat previous IDs as unverified historical keys.
      parameters:
      - name: public_contract
        in: query
        required: false
        schema:
          type: string
          enum:
          - transport-1.0.0
        description: Opt in to the strict public transport DTO. Incompatible with projection=true. debug never adds diagnostics to this contract. Also available under /api/v1.
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^roote_transport_station_[a-f0-9]{20}$
      - name: projection
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include shared transport presentation from the same acquired departures and stored structures
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Maximum departures
      - name: at
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Earliest departure as Unix seconds
      - name: line
        in: query
        required: false
        schema:
          type: string
        description: Optional canonical line number or name
      - name: direction
        in: query
        required: false
        schema:
          type: string
        description: Optional direction filter
      - name: debug
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include safe provider diagnostics
      - name: token
        in: query
        deprecated: true
        schema:
          type: string
      responses:
        '200':
          description: Normalized upcoming departures
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - success
                      - empty
                      - partial
                      - error
                    station_id:
                      type: string
                      minLength: 1
                    total:
                      type: integer
                      minimum: 0
                      maximum: 50
                    departures:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            pattern: ^roote_transport_departure_[a-f0-9]{20}$
                          type:
                            type: string
                            const: transport_departure
                          station_id:
                            type: string
                            minLength: 1
                          mode:
                            type: string
                            enum:
