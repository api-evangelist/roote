    post:
      operationId: createTransportJourney
      security:
      - bearerAuth: []
      x-roote-required-scope: journey:read
      summary: Calculate a journey with ordered waypoints
      description: Requires journey:read. Journey Contract 1.0.0. POST is used because ordered waypoint and constraint objects do not fit a stable query string. Providers without native waypoint support are called segment by segment with propagated times and continuity checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - origin
              - destination
              properties:
                origin:
                  type: object
                  required:
                  - lat
                  - lon
                  properties:
                    lat:
                      type: number
                    lon:
                      type: number
                destination:
                  type: object
                  required:
                  - lat
                  - lon
                  properties:
                    lat:
                      type: number
                    lon:
                      type: number
                waypoints:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required:
                    - lat
                    - lon
                    properties:
                      lat:
                        type: number
                      lon:
                        type: number
                departure_time:
                  oneOf:
                  - type: string
                    format: date-time
                  - type: integer
                arrival_time:
                  oneOf:
                  - type: string
                    format: date-time
                  - type: integer
                modes:
                  type: array
                  items:
                    type: string
                    enum:
                    - walk
                    - bus
                    - tram
                    - metro
                    - cable_car
                    - regional_rail
                    - train
                    - ferry
                    - shuttle
                constraints:
                  type: object
