openapi: 3.2.0
info:
  title: ROOTE Transit API
  version: 2.0.0
  description: Worldwide live mobility near a coordinate.
servers:
- url: https://api.roote.ai
  description: ROOTE API
tags:
- name: Transit
paths:
  /v1/transit/nearby:
    get:
      operationId: getNearbyTransport
      security:
      - {}
      - bearerAuth: []
      summary: Find nearby public transport stations
      description: Multi-provider transit discovery. ROOTE automatically queries configured complementary aggregators in parallel, then normalizes and conservatively resolves their identities. Realtime departures and alerts are intentionally not fetched by this endpoint.
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
        description: Latitude of query_origin
      - name: lng
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
        description: Longitude; supply lng or lon.
      - name: lon
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
        description: ROOTE compatibility alias for lng.
      - name: radius
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 5000
          default: 1000
        description: Requested metres; values above 5000 are clamped to 5000
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Maximum returned stations; capability policy can apply a lower limit
      - name: modes
        in: query
        schema:
          type: string
          default: bus,tram,metro,cable_car,regional_rail,train,ferry,shuttle
        description: Comma-separated canonical ROOTE transit modes
      - name: providers
        in: query
        schema:
          type: string
        description: Optional diagnostic override. Normal clients should omit it so ROOTE can select configured providers automatically.
      - name: realtime
        in: query
        schema:
          type: boolean
          default: false
        description: Reserved preference; Nearby reports capabilities without fetching departures or alerts.
      - name: language
        in: query
        schema:
          type: string
        description: Preferred response language for providers that support it.
      - name: debug
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include provider and cache diagnostics
      - name: token
        in: query
        deprecated: true
        schema:
          type: string
        description: Compatibility API token; prefer Authorization Bearer.
