  /v1/transit/journey:
    get:
      operationId: getTransportJourney
      security:
      - bearerAuth: []
      x-roote-required-scope: journey:read
      summary: Calculate an A-to-B public transport journey
      description: Requires journey:read. Legacy-compatible A-to-B form of Journey Contract 1.0.0. Provider fallback is sequential by default; compare is explicit. scheduled_at remains distinct from realtime estimated_at.
      parameters:
      - name: origin_lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
        description: Origin latitude
      - name: origin_lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
        description: Origin longitude
      - name: destination_lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
        description: Destination latitude
      - name: destination_lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
        description: Destination longitude
      - name: departure_time
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            format: date-time
          - type: integer
            minimum: 1
        description: ISO 8601 or Unix seconds; incompatible with arrival_time
      - name: arrival_time
        in: query
        required: false
        schema:
          oneOf:
          - type: string
            format: date-time
          - type: integer
            minimum: 1
        description: ISO 8601 or Unix seconds; incompatible with departure_time
      - name: modes
        in: query
        required: false
        schema:
          type: string
          default: walk,bus,tram,metro,cable_car,regional_rail,train,ferry,shuttle
        description: Comma-separated canonical ROOTE modes
      - name: max_transfers
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 3
        description: Requested maximum; server applies at most 4
      - name: wheelchair
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Require wheelchair-compatible planning where supported
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 3
        description: Requested alternatives; capability limits and a maximum of 10 apply
      - name: providers
        in: query
        required: false
        schema:
          type: string
        description: 'Optional ordered list: transit,tripgo,navitia'
      - name: provider_strategy
        in: query
        required: false
        schema:
          type: string
          enum:
          - primary
          - fallback
          - compare
          default: fallback
        description: Normal primary selection, controlled fallback, or explicit comparison
      - name: language
        in: query
        required: false
        schema:
          type: string
        description: Preferred provider response language
      - name: debug
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include safe provider and cache diagnostics
