aid: roote

name: ROOTE

description: ROOTE provides a French-language mobility platform that offers live mobility data, geocoding, nearby transport options, and urban
  services via a REST API. The service targets developers building AI agents, mobile apps, and location‑based products, delivering real‑time information
  on transport options, routes, and availability across multiple cities.

